<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="MOHAMED EL NAGGAR — Digital Business Card">
  <title>MOHAMED EL NAGGAR | Digital Card</title>
  <style>
    :root { color-scheme: light; --ink:#171717; --muted:#777; --line:#ededed; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:#f7f7f7; color:var(--ink);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width:min(100%, 390px); background:#fff; border:1px solid var(--line);
      border-radius:24px; padding:38px 26px 28px; text-align:center;
      box-shadow:0 18px 55px rgba(0,0,0,.055);
    }
    .mark {
      width:68px; height:68px; margin:0 auto 22px; border:1px solid #e5e5e5;
      border-radius:50%; display:grid; place-items:center; font-size:21px;
      font-weight:650; letter-spacing:1px;
    }
    h1 { margin:0; font-size:23px; letter-spacing:1.5px; font-weight:650; }
    .subtitle { margin:9px 0 28px; color:var(--muted); font-size:13px; letter-spacing:.4px; }
    .links { display:grid; gap:11px; }
    a.action {
      min-height:52px; display:flex; align-items:center; justify-content:center; gap:10px;
      border:1px solid var(--line); border-radius:13px; color:var(--ink);
      text-decoration:none; font-size:14px; font-weight:550; transition:.18s ease;
    }
    a.action:hover { border-color:#bdbdbd; transform:translateY(-1px); }
    .icon { width:18px; height:18px; display:inline-grid; place-items:center; }
    .save {
      width:100%; margin-top:18px; min-height:52px; border:0; border-radius:13px;
      background:#171717; color:#fff; font-size:14px; font-weight:600; cursor:pointer;
    }
    .footer { margin-top:23px; color:#aaa; font-size:11px; letter-spacing:1.3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">MN</div>
    <h1>MOHAMED EL NAGGAR</h1>
    <p class="subtitle">DIGITAL BUSINESS CARD</p>

    <div class="links">
      <a class="action" href="tel:+201090813285">
        <span class="icon" aria-hidden="true">☎</span> Call · 010 9081 3285
      </a>
      <a class="action" href="https://wa.me/201090813285" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">◉</span> WhatsApp
      </a>
      <a class="action" href="https://www.instagram.com/muhammadahmeddn/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">◎</span> Instagram
      </a>
    </div>

    <button class="save" onclick="saveContact()">＋ Save Contact</button>
    <div class="footer">MOHAMED EL NAGGAR</div>
  </main>

  <script>
    function saveContact() {
      const vcard = [
        "BEGIN:VCARD", "VERSION:3.0",
        "FN:MOHAMED EL NAGGAR",
        "TEL;TYPE=CELL:+201090813285",
        "URL:https://www.instagram.com/muhammadahmeddn/",
        "END:VCARD"
      ].join("\\r\\n");
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "Mohamed-El-Naggar.vcf";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
